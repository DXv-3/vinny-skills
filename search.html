<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>vinny-skills index</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;font:15px/1.5 ui-monospace,Menlo,monospace;background:#0d1117;color:#e6edf3;padding:24px}
h1{font-size:18px}input{width:100%;padding:12px 14px;font:inherit;background:#161b22;border:1px solid #30363d;border-radius:8px;color:inherit;margin:12px 0}
.pill{display:inline-block;padding:2px 8px;border-radius:99px;font-size:11px;border:1px solid #30363d;margin-right:6px}
.active{color:#3fb950}.archived{color:#d29922}.vendor-user{color:#58a6ff}
.card{border:1px solid #21262d;border-radius:10px;padding:12px;margin-bottom:8px}.card:hover{border-color:#388bfd}
small{color:#7d8590}#count{color:#7d8590}
</style></head><body>
<h1>vinny-skills <span id="count"></span></h1>
<input id="q" placeholder="filter… (⌘K)" autofocus>
<div id="out"></div>
<script>
let S=[];const out=document.getElementById('out'),q=document.getElementById('q');
fetch('./catalog.json').then(r=>r.json()).then(c=>{
  S=c.skills;render(S);document.getElementById('count').textContent=`— ${c.total} skills · ${new Date(c.generated_at).toISOString().slice(0,10)}`;
});
function esc(s){return (s||'').replace(/[<>&]/g,m=>({'<':'&lt;','>':'&gt;','&':'&amp;'}[m]))}
function render(list){out.innerHTML=list.slice(0,300).map(s=>`<div class="card"><span class="pill ${s.tier}">${s.tier}</span><span class="pill">${s.source}</span> <b>${esc(s.rel_path)}</b><br><small>${esc((s.description||'').slice(0,160))}</small></div>`).join('')+(list.length>300?`<small>…and ${list.length-300} more — refine filter</small>`:'')}
q.addEventListener('input',()=>{const v=q.value.toLowerCase();render(S.filter(s=>!v||(s.rel_path+' '+s.description+' '+s.source).toLowerCase().includes(v)))});
addEventListener('keydown',e=>{if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();q.focus()}});
</script></body></html>
